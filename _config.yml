title: pressmeow
description: Apps for the little moments of your day. Isleday, tuttiday, iyyko and Ourhour, built on the side by a dev & designer who works with teams by day.
url: https://pressmeow.github.io
baseurl: ""
author: pressmeow

# a note lives at /blog/2026/11/19/its-file-name/
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - WRITING.md
